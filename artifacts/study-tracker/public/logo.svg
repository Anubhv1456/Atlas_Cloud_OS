<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181a1d" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g transform="translate(0, -10)">
    <!-- Glowing star at top -->
    <path d="M256,80 C256,115 262,120 297,120 C262,120 256,125 256,160 C256,125 250,120 215,120 C250,120 256,115 256,80 Z" fill="#84f6d4" filter="url(#glow)" />
    <!-- Left triangle -->
    <path d="M256,120 L126,325 L256,270 Z" fill="#2ebfa5" />
    <!-- Right triangle -->
    <path d="M256,120 L386,325 L256,270 Z" fill="#3b4859" />
    <!-- Text ATLAS -->
    <text x="260" y="415" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="0.38em" text-anchor="middle">ATLAS</text>
  </g>
</svg>
