    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('theme') === 'dark' || !('theme' in localStorage);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedMode = localStorage.getItem('atlas_theme_mode') || 'atlas';
          document.documentElement.setAttribute('data-theme', savedMode);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Zero-Flicker Native Launch Screen Canvas */
      html, body {
        background-color: #F2F2F7;
        color: #1c1c1e;
      }
      html.dark, html.dark body {
        background-color: #000000;
        color: #f4f4f5;
      }
      #root:empty {
        background-color: inherit;
      }
    </style>

  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.indexOf('Script error') !== -1) {
          // Suppress anonymous cross-origin WebKit error noise
          return;
        }
        if (e && e.message && e.message.includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
          return;
        }
        console.error('Global window error:', e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          (typeof e.reason === 'string' && e.reason.includes('WebSocket')) ||
          (e.reason.message && typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket'))
        )) {
          e.preventDefault();
          return;
        }
        console.warn('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
